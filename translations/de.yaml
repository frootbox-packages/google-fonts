# German texts of Google Fonts: the screen and the errors of the import (decision 0252).
"Google Fonts": "Google Fonts"
"Search the catalog of Google Fonts and import fonts once, so visitors load them from the own domain": "Den Katalog von Google Fonts durchsuchen und Schriften einmal importieren, damit Besucher sie von der eigenen Domain laden"
"Fonts": "Schriften"
"Fonts from Google Fonts, copied once to this website. Visitors load them from here, Google does not learn of them. You choose them in the design.": "Schriften von Google Fonts, einmal auf diese Website kopiert. Besucher laden sie von hier, Google erfährt nichts davon. Auswählen kannst Du sie im Design."
"Design": "Design"
"On this website": "Auf dieser Website"
"No fonts yet": "Noch keine Schriften"
"Search the catalog below and import a font.": "Durchsuche unten den Katalog und importiere eine Schrift."
"with italics": "mit Kursiv"
"With italics": "Mit Kursiv"
"{count} file": { one: "{count} Datei", other: "{count} Dateien" }
"{count} style": { one: "{count} Schnitt", other: "{count} Schnitte" }
"variable": "variabel"
"Import {name} again": "{name} neu importieren"
"The font is imported again.": "Die Schrift ist neu importiert."
"Remove {name}": "{name} entfernen"
"Remove {name}?": "{name} entfernen?"
"Its files are deleted. While the design uses the font, it cannot go.": "Ihre Dateien werden gelöscht. Solange das Design die Schrift nutzt, lässt sie sich nicht entfernen."
"The font is removed.": "Die Schrift ist entfernt."
"Search": "Suchen"
"Name of the font": "Name der Schrift"
"Kind": "Art"
"All kinds": "Alle Arten"
"Sans-serif": "Serifenlos"
"Serif": "Serif"
"Display": "Display"
"Handwriting": "Handschrift"
"Monospace": "Monospace"
"The server asks Google Fonts only when you search, at most once a day. Search without a name for the most used fonts.": "Der Server fragt Google Fonts erst, wenn Du suchst, und höchstens einmal am Tag. Ohne Namen findest Du die meistgenutzten Schriften."
"Nothing found": "Nichts gefunden"
"Try another search.": "Versuch es mit einer anderen Suche."
"Imported": "Importiert"
"Import": "Importieren"
"Import {name}": "{name} importieren"
"The font is imported.": "Die Schrift ist importiert."
"Google Fonts has no family \"{family}\".": "Google Fonts hat keine Schrift „{family}“."
"Google Fonts gave no WOFF2 files for \"{family}\". Nothing was imported.": "Google Fonts hat für „{family}“ keine WOFF2-Dateien geliefert. Nichts wurde importiert."
"There is no such imported font.": "Diese Schrift ist nicht importiert."
"The design uses the font \"{family}\". Choose another font there first.": "Das Design nutzt die Schrift „{family}“. Wähle dort zuerst eine andere."
"Google Fonts names a file outside of fonts.gstatic.com. Nothing was imported.": "Google Fonts nennt eine Datei außerhalb von fonts.gstatic.com. Nichts wurde importiert."
"Google Fonts cannot be reached. Try it again later.": "Google Fonts ist nicht erreichbar. Versuch es später noch einmal."
"Google Fonts answered in a way this module does not know. Perhaps the catalog moved; an update of the module will help.": "Google Fonts antwortet anders, als dieses Modul es kennt. Vielleicht ist der Katalog umgezogen; ein Update des Moduls hilft."
